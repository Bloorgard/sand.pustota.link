<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4f4f1">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>sand.pustota.link</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --ink: #111111;
      --table: #f4f4f1;
      --glass: rgba(244, 244, 241, .84);
      --line: rgba(17, 17, 17, .34);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--table);
      color: var(--ink);
    }

    button { font: inherit; }

    #sand {
      cursor: none;
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
      touch-action: none;
    }

    .topbar {
      position: fixed;
      z-index: 3;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      pointer-events: none;
    }

    .brand {
      display: grid;
      gap: 5px;
      user-select: none;
    }

    .brand strong {
      font-size: 12px;
      line-height: 1;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 720;
    }

    .brand span {
      font-size: 11px;
      line-height: 1.35;
      opacity: .54;
    }

    .actions {
      display: flex;
      pointer-events: auto;
    }

    .actions button {
      padding: 0 2px;
      border: 0;
      border-bottom: 1px solid rgba(26, 28, 30, .22);
      opacity: .7;
      color: inherit;
      background: transparent;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .actions button:last-child { border-right: 0; }
    .actions button:hover, .actions button:focus-visible { background: rgba(255,255,255,.14); }
    .actions button:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }

    /* Контролы скребка — под рукой, внизу по центру, без рамки: отступ от
       ползунка до подписи и до значения одинаковый. */
    .tool-group {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: max(52px, calc(env(safe-area-inset-bottom) + 52px));
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      pointer-events: auto;
    }

    .parameter-control {
      display: flex;
      align-items: center;
      gap: 10px;
      /* важна вертикаль ползунков, подпись подстраивается под неё */
    }

    .parameter-control > span {
      min-width: 44px;
      text-align: right;
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: .72;
    }

    .parameter-control input {
      width: 112px;
    }

    .parameter-control output {
      min-width: 26px;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      text-align: left;
    }

    .parameter-control input {
      width: 82px;
      margin: 0;
      accent-color: var(--ink);
      cursor: ew-resize;
    }


    /* На узком окне контролы встают в две строки: вдвое уже — и панель
       материала до них уже не дотягивается. Место при этом не меняется:
       прыжок элементов снизу вверх сбивает сильнее, чем теснота. */
    @media (max-width: 1180px) {
      .tool-group {
        flex-direction: column;
        gap: 6px;
      }
    }

    /* Ползунки: тонкая линия и квадратный бегунок. Капсула со сплошной
       заливкой весит визуально больше, чем значение, которое она несёт. */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      height: 16px;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 1px;
      background: linear-gradient(to right,
        rgba(26, 28, 30, .85) 0 var(--fill, 50%),
        rgba(26, 28, 30, .16) var(--fill, 50%) 100%);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      margin-top: -5px;
      border-radius: 1px;
      background: #1a1c1e;
    }

    input[type=range]::-moz-range-track {
      height: 1px;
      background: rgba(26, 28, 30, .16);
    }

    input[type=range]::-moz-range-progress {
      height: 1px;
      background: rgba(26, 28, 30, .85);
    }

    input[type=range]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 1px;
      background: #1a1c1e;
    }

    body.panning #sand { cursor: grab; }
    body.panning:active #sand { cursor: grabbing; }

    .invite {
      position: fixed;
      z-index: 2;
      left: 50%;
      top: 42%;                 /* выше геометрического центра: там панели */
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: .06em;
      opacity: .55;
      pointer-events: none;

      padding: 0 5px;

    .panel-left { left: max(18px, env(safe-area-inset-left)); width: 232px; }

    .panel-toggle {

      padding: 0;

    /* В моноширинном ⇧ и ⌘ втискиваются в ячейку буквы и выходят вдвое ниже

    }

    .panel kbd.wide {

      font-size: 9px;
      letter-spacing: .03em;

    .panel label {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2px 8px;
      margin-bottom: 7px;
      font-size: 11px;
      opacity: .75;
    }

    .panel label input {
      grid-column: 1 / -1;

      margin-bottom: 12px;

<body>
  <canvas id="sand" aria-label="Пустой стол с конечной горстью песка. Зажмите и ведите скребок, чтобы придавать кучке форму."></canvas>

  <header class="topbar">
    <div class="brand">
      <strong>sand.pustota.link</strong>
    </div>
    <nav class="actions" aria-label="Действия">
      <button id="export" type="button">экспорт</button>
    </nav>
  </header>

  <div class="tool-group" role="group" aria-label="Скребок">
    <label class="parameter-control" for="angle">
      <span>угол</span>
      <input id="angle" type="range" min="0" max="180" step="1" value="45">
      <output id="angle-value" for="angle">45°</output>
    </label>
    <label class="parameter-control" for="length">
      <span>длина</span>
      <input id="length" type="range" min="20" max="240" step="5" value="150">
      <output id="length-value" for="length">150</output>
    </label>
  </div>

  <div id="invite" class="invite">
    <span>чтобы насыпать песок, зажми</span> <kbd>A</kbd>
  </div>
  <div id="status" class="status" aria-live="polite"></div>

  <aside id="physics" class="panel panel-left" aria-label="Настройки материала">
    <button class="panel-toggle" type="button" aria-expanded="true" aria-controls="physics-body">
      материал
    </button>
    <div class="panel-body" id="physics-body">
    <div class="style-switch" role="group" aria-label="Графика">
      <button type="button" data-style="plain" aria-pressed="false">плоский</button>
      <button type="button" data-style="light" aria-pressed="true">свет</button>
    </div>
    <label><span>откос</span><output>2.05</output><input type="range" id="p-talus" min="0" max="3" step="0.05" value="2.05"></label>
    <label><span>осыпание</span><output>0.24</output><input type="range" id="p-relax" min="0" max="0.25" step="0.01" value="0.24"></label>
    <label><span>слёживание</span><output>0.17</output><input type="range" id="p-settle" min="0" max="0.3" step="0.01" value="0.17"></label>
    <label><span>сцепление</span><output>3.5</output><input type="range" id="p-cohesion" min="0" max="8" step="0.1" value="3.5"></label>
    <label><span>высота лезвия</span><output>60</output><input type="range" id="p-blade" min="4" max="200" step="2" value="60"></label>
    <label><span>россыпь</span><output>0.3</output><input type="range" id="p-spray" min="0" max="3" step="0.1" value="0.3"></label>
    <label><span>струя</span><output>2600</output><input type="range" id="p-pour" min="400" max="12000" step="100" value="2600"></label>
    </div>
  </aside>

  <aside id="legend" class="panel panel-right" aria-label="Клавиши">
    <button class="panel-toggle" type="button" aria-expanded="true" aria-controls="legend-body">
      клавиши
    </button>
    <div class="panel-body" id="legend-body">
      <div class="key"><span><kbd>Q</kbd><kbd>W</kbd></span> поворот</div>
      <div class="key"><span><kbd><i>⇧</i>Q</kbd><kbd><i>⇧</i>W</kbd></span> шаг 45°</div>
      <div class="key"><span><kbd>S</kbd><kbd>D</kbd></span> длина</div>
      <div class="key"><span><kbd>A</kbd></span> сыпать</div>
      <div class="key"><span><kbd>X</kbd></span> очистить</div>
      <div class="key"><span><kbd><i>⌘</i>Z</kbd></span> отменить</div>
      <div class="key"><span><kbd class="wide">space</kbd></span> двигать стол</div>
      <div class="key"><span><kbd>M</kbd></span> материал</div>
    </div>
  </aside>

  <script src="engine/sand.js"></script>
  <script src="engine/render.js"></script>

  <script>
  (() => {
    'use strict';

    const canvas = document.querySelector('#sand');
    const context = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const invite = document.querySelector('#invite');
    const status = document.querySelector('#status');
    const exportButton = document.querySelector('#export');
    const angleInput = document.querySelector('#angle');
    const angleValue = document.querySelector('#angle-value');
    const lengthInput = document.querySelector('#length');
    const lengthValue = document.querySelector('#length-value');
    const styleButtons = document.querySelectorAll('.style-switch button');
    const panels = [document.querySelector('#physics'), document.querySelector('#legend')];
    const physics = document.querySelector('#physics');

    const SAVE_KEY = 'sand.pustota.sculpt06';
    const ANGLE_KEY = 'sand.pustota.scraper-angle';
    const LENGTH_KEY = 'sand.pustota.scraper-length';
    const STYLE_KEY = 'sand.pustota.style';
    const MAX_HEIGHT = 64.0;        // потолок упаковки: вал доходит до сорока
    const SAVE_VERSION = 3;

    const STAGE = 2;        // стол вдвое больше окна по каждой стороне
    let engine = null;
    let target = null;
    let stageWidth = 0, stageHeight = 0;
    // левый верхний угол видимой части стола
    const view = { x: 0, y: 0 };
    let panning = false;
    let initialMass = 0;
    let baseMass = 0;      // масса первой раздачи: с ней сравнивается досыпанное
    let style = 'light';

    let activePointer = null;
    let dirty = false;
    let saveTimer = 0;
    let frameTimes = [];
    let lastFrameTime = performance.now();
    const PANELS_KEY = 'sand.pustota.panels';
    let toolAngle = 45;
    let toolLength = 150;

    // скребок: где он и ведут ли его прямо сейчас
    const tool = { x: 0, y: 0, px: 0, py: 0, down: false };
    // История для отката. Снимок поля — это 500 КБ на шаг, а жест меняет
    // около двух процентов клеток, поэтому храним разницу: индекс и прежнее
    // значение. Двадцать шагов укладываются в единицы сотен килобайт.
    const UNDO_DEPTH = 20;
    const history = [];
    let strokeStart = null;
    let commitTimer = 0;

    // Отрезки жеста, накопленные между кадрами. Без очереди быстрый штрих
    // пропадает целиком: down, move и up успевают пройти до ближайшего кадра,
    // и к моменту отрисовки вести уже нечего.
    const pending = [];
    const toolPose = { x: innerWidth * 0.72, y: innerHeight * 0.72 };

    try {
      if (localStorage.getItem(STYLE_KEY) === 'plain') style = 'plain';
    } catch (_) {}

    try {
      const rawAngle = localStorage.getItem(ANGLE_KEY);
      if (rawAngle !== null) {
        const storedAngle = Number(rawAngle);
        if (Number.isFinite(storedAngle)) toolAngle = clamp(storedAngle, 0, 180);
      }
    } catch (_) {}

    try {
      const rawLength = localStorage.getItem(LENGTH_KEY);
      if (rawLength !== null) {
        const storedLength = Number(rawLength);
        if (Number.isFinite(storedLength)) toolLength = clamp(storedLength, 20, 240);
      }
    } catch (_) {}

    resizeCanvas();
    initialize();
    addEventListener('resize', onResize, { passive: true });
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', event => finishPointer(event, false));
    canvas.addEventListener('pointercancel', event => finishPointer(event, true));
    exportButton.addEventListener('click', exportImage);
    angleInput.addEventListener('input', () => setToolAngle(Number(angleInput.value)));
    lengthInput.addEventListener('input', () => setToolLength(Number(lengthInput.value)));
    for (const button of styleButtons) {
      button.addEventListener('click', () => {
        style = button.dataset.style;
        applyStyle();
      });
    }
    setToolAngle(toolAngle, false);
    setToolLength(toolLength, false);
    applyStyle();
    bindPhysicsPanel();
    bindPanels();
    bindRanges();
    requestAnimationFrame(tick);

    function applyStyle() {
      for (const button of styleButtons)
        button.setAttribute('aria-pressed', button.dataset.style === style ? 'true' : 'false');
      try { localStorage.setItem(STYLE_KEY, style); } catch (_) {}
    }

    // Обе панели раскрыты при первом приходе: сначала показать, чем можно
    // управлять, а свернуть человек решит сам. Выбор запоминается.
    // Заполненную часть дорожки нельзя выразить чистым CSS, поэтому долю
    // держим в переменной и обновляем при каждом изменении.
    function paintRange(input) {
      const min = Number(input.min) || 0, max = Number(input.max) || 100;
      const value = Number(input.value);
      input.style.setProperty('--fill', ((value - min) / (max - min) * 100).toFixed(1) + '%');
    }

    function bindRanges() {
      for (const input of document.querySelectorAll('input[type=range]')) {
        paintRange(input);
        input.addEventListener('input', () => paintRange(input));
      }
    }

    function bindPanels() {
      let collapsed = [];
      try { collapsed = JSON.parse(localStorage.getItem(PANELS_KEY) || '[]'); } catch (_) {}
      panels.forEach((panel, index) => {
        const toggle = panel.querySelector('.panel-toggle');
        if (collapsed.includes(index)) toggle.setAttribute('aria-expanded', 'false');
        toggle.addEventListener('click', () => {
          const open = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', open ? 'false' : 'true');
          savePanels();
        });
      });
    }

    function savePanels() {
      const collapsed = panels
        .map((panel, index) => panel.querySelector('.panel-toggle').getAttribute('aria-expanded') === 'false' ? index : -1)
        .filter(index => index >= 0);
      try { localStorage.setItem(PANELS_KEY, JSON.stringify(collapsed)); } catch (_) {}
    }

    // Панель материала — инструмент настройки: значения не сохраняются между
    // сессиями, рабочая калибровка живёт в значениях по умолчанию движка.
    function bindPhysicsPanel() {
      for (const input of physics.querySelectorAll('input')) {
        const key = input.id.slice(2);          // p-talus → talus
        const out = input.parentElement.querySelector('output');
        const sync = () => {
          engine.params[key] = Number(input.value);
          out.textContent = input.value;
        };
        input.addEventListener('input', sync);
        sync();
      }
    }

    // ── клавиши под левой рукой, по event.code — работают в любой раскладке ──
    const keys = new Set();
    const HOTKEYS = ['KeyQ', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyX'];

    addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        if (!panning) { panning = true; document.body.classList.add('panning'); }
        return;
      }
      if (event.code === 'KeyZ' && (event.metaKey || event.ctrlKey)) {
        event.preventDefault();
        undo();
        return;
      }
      // M — «материал»; обратная кавычка работает по старой памяти, но в
      // легенде её не нарисовать: это штрих высотой в пару пикселей
      if (event.code === 'KeyM' || event.code === 'Backquote') {
        event.preventDefault();
        const toggle = physics.querySelector('.panel-toggle');
        toggle.setAttribute('aria-expanded',
          toggle.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
        savePanels();
        return;
      }
      if (!HOTKEYS.includes(event.code)) return;
      event.preventDefault();
      if (event.repeat) return;
      // с шифтом поворот идёт щелчками по 45°, без него — плавно
      if (event.shiftKey && event.code === 'KeyQ') { snapAngle(-45); return; }
      if (event.shiftKey && event.code === 'KeyW') { snapAngle(45); return; }
      if (event.code === 'KeyX') { resetSand(); return; }
      keys.add(event.code);
    });
    addEventListener('keyup', event => {
      if (event.code === 'Space') { panning = false; document.body.classList.remove('panning'); return; }
      if (event.code === 'KeyA') scheduleCommit();
      if (!keys.delete(event.code)) return;
      // при удержании параметры не пишутся в хранилище каждый кадр —
      // сохраняем один раз, когда клавишу отпустили
      if (event.code === 'KeyQ' || event.code === 'KeyW') setToolAngle(toolAngle);
      if (event.code === 'KeyS' || event.code === 'KeyD') setToolLength(toolLength);
    });
    addEventListener('blur', () => {
      keys.clear();
      panning = false;
      document.body.classList.remove('panning');
    });

    function snapAngle(delta) {
      const snapped = Math.round(toolAngle / 45) * 45 + delta;
      setToolAngle((snapped % 180 + 180) % 180);
    }

    function applyKeys(dt) {
      if (!keys.size) return;
      const rot = 75 * dt, grow = 260 * dt;
      if (keys.has('KeyA')) {
        if (!strokeStart) beginHistory();
        engine.pour(toolPose.x + view.x, toolPose.y + view.y, dt);
        if (!baseMass) baseMass = engine.mass();
        scheduleSave(900);
        updateInvite();
      }
      if (keys.has('KeyQ')) setToolAngle(((toolAngle - rot) % 180 + 180) % 180, false);
      if (keys.has('KeyW')) setToolAngle((toolAngle + rot) % 180, false);
      if (keys.has('KeyS')) setToolLength(toolLength - grow, false);
      if (keys.has('KeyD')) setToolLength(toolLength + grow, false);
    }

    function resizeCanvas() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(innerWidth * dpr));
      canvas.height = Math.max(1, Math.round(innerHeight * dpr));
      toolPose.x = clamp(toolPose.x, 0, innerWidth);
      toolPose.y = clamp(toolPose.y, 0, innerHeight);
      target = SandRender.createTarget(context, canvas.width, canvas.height, dpr);
    }

    // Ресайз не должен стирать работу: движок переносит поле сам, стол просто
    // прирастает или убывает справа и снизу.
    let resizeTimer = 0;

    function onResize() {
      resizeCanvas();
      stageWidth = innerWidth * STAGE;
      stageHeight = innerHeight * STAGE;
      engine.resize(stageWidth, stageHeight);
      clampView();
      placeCard(toolPose.x, toolPose.y, toolAngle);
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => scheduleSave(0), 300);
    }

    // Стол начинается пустым: песок появляется там, где его насыпали, а не в
    // центре, куда потом не помещается рисунок.
    function initialize(forceFresh = false) {
      stageWidth = innerWidth * STAGE;
      stageHeight = innerHeight * STAGE;
      engine = SandEngine.create(stageWidth, stageHeight);
      // начинаем в середине стола: край одинаково далеко во все стороны
      view.x = (stageWidth - innerWidth) / 2;
      view.y = (stageHeight - innerHeight) / 2;
      const saved = forceFresh ? null : loadState();
      if (saved) engine.adopt(saved.field, saved.cols, saved.rows);
      initialMass = engine.mass();
      baseMass = initialMass;
      dirty = false;
      updateInvite();
    }

    function updateInvite() {
      invite.classList.toggle('gone', engine.mass() > 1);
    }

    function tick(now) {
      const elapsed = now - lastFrameTime;
      lastFrameTime = now;
      frameTimes.push(elapsed);
      if (frameTimes.length > 36) frameTimes.shift();

      applyKeys(Math.min(elapsed, 50) / 1000);

      if (pending.length) {
        for (const point of pending) {
          engine.blade(tool.px, tool.py, point.x, point.y, toolAngle, toolLength);
          tool.px = point.x; tool.py = point.y;
        }
        tool.x = tool.px; tool.y = tool.py;
        pending.length = 0;
        dirty = true;
      }
      engine.stampWall(tool.x, tool.y, tool.px, tool.py, toolAngle, toolLength, tool.down);
      engine.tick();

      target.viewX = view.x; target.viewY = view.y;
      SandRender.draw(target, engine, style);
      drawEdges();
      drawTool();

      if (Math.floor(now / 800) !== Math.floor((now - elapsed) / 800)) {
        updateStatus();
        updateInvite();
      }
      requestAnimationFrame(tick);
    }

    function exportImage() {
      SandRender.draw(target, engine, style);   // без скребка: он не часть работы
      canvas.toBlob(blob => {
        if (!blob) return;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `sand-sculpture-${new Date().toISOString().slice(0, 10)}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/png');
    }

    // Масса сохраняется, поэтому «100% песка» — не новость, а шум. Строка
    // молчит, пока сказать нечего: говорит о досыпанном песке и о просадке.
    let lastStatus = '';

    function updateStatus() {
      const average = frameTimes.length ? frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length : 16.7;
      const fps = Math.round(1000 / Math.max(average, 1));
      const mass = engine.mass();
      const parts = [];
      if (baseMass && mass > baseMass * 1.02)
        parts.push(`песка ×${(mass / baseMass).toFixed(1)}`);
      if (fps < 45) parts.push(`${fps} fps`);
      const text = parts.join(' · ');
      if (text === lastStatus) return;
      lastStatus = text;
      status.textContent = text;
    }

    function getStats() {
      const mass = engine.mass();
      return {
        cols: engine.cols,
        rows: engine.rows,
        cell: engine.cell,
        mass,
        initialMass,
        massError: initialMass ? (mass - initialMass) / initialMass : 0,
        airborne: engine.free.count,
        active: activePointer !== null,
        toolAngle,
        toolLength,
        style,
        renderer: 'grain2d'
      };
    }

    function resetSand() {
      beginHistory();
      try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
      engine.clear();
      commitHistory();
      initialMass = 0;
      baseMass = 0;
      dirty = true;
      updateInvite();
    }

    function scheduleSave(delay) {
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveState, delay);
    }

    function clampView() {
      view.x = clamp(view.x, 0, Math.max(0, stageWidth - innerWidth));
      view.y = clamp(view.y, 0, Math.max(0, stageHeight - innerHeight));
      if (target) { target.viewX = view.x; target.viewY = view.y; }
    }

    // на столе, а не на экране: скребок живёт в координатах поля
    function toStage(x, y) { return { x: x + view.x, y: y + view.y }; }

    function clampToolScreen(x, y, angle) {
      const width = toolLength;
      const height = 6;
      const radians = angle * Math.PI / 180;
      const halfX = Math.abs(Math.cos(radians)) * width * 0.5 + Math.abs(Math.sin(radians)) * height * 0.5;
      const halfY = Math.abs(Math.sin(radians)) * width * 0.5 + Math.abs(Math.cos(radians)) * height * 0.5;
      return {
        x: clamp(x, halfX + 2, innerWidth - halfX - 2),
        y: clamp(y, halfY + 2, innerHeight - halfY - 2)
      };
    }

    function placeCard(x, y, angle) {
      const screen = clampToolScreen(x, y, angle);
      toolPose.x = screen.x;
      toolPose.y = screen.y;
    }

    // Край стола: у холста есть предел, и упереться в него нужно видеть.
    // Рисуем только те стороны, что попали в кадр.
    function drawEdges() {
      const scale = target.scale;
      const left = -view.x, top = -view.y;
      const right = stageWidth - view.x, bottom = stageHeight - view.y;
      context.save();
      context.strokeStyle = 'rgba(26, 28, 30, .16)';
      context.lineWidth = scale;
      context.setLineDash([scale * 5, scale * 5]);
      context.beginPath();
      if (left >= 0) { context.moveTo(left * scale, 0); context.lineTo(left * scale, canvas.height); }
      if (top >= 0) { context.moveTo(0, top * scale); context.lineTo(canvas.width, top * scale); }
      if (right <= innerWidth) { context.moveTo(right * scale, 0); context.lineTo(right * scale, canvas.height); }
      if (bottom <= innerHeight) { context.moveTo(0, bottom * scale); context.lineTo(canvas.width, bottom * scale); }
      context.stroke();
      context.restore();
    }

    // Скребок — линия на холсте, а не элемент страницы: карточка с градиентом
    // и тенью спорила с зерном, линия честнее показывает, где кромка.
    function drawTool() {
      const scale = target.scale;
      const radians = toolAngle * Math.PI / 180;
      const hx = Math.cos(radians) * toolLength * 0.5 * scale;
      const hy = Math.sin(radians) * toolLength * 0.5 * scale;
      const x = toolPose.x * scale, y = toolPose.y * scale;
      context.save();
      context.lineCap = 'round';
      context.strokeStyle = tool.down ? 'rgba(26, 28, 30, .85)' : 'rgba(26, 28, 30, .3)';
      context.lineWidth = (tool.down ? 3 : 2) * scale;
      context.beginPath();
      context.moveTo(x - hx, y - hy);
      context.lineTo(x + hx, y + hy);
      context.stroke();
      context.restore();
    }

    function setToolAngle(value, persist = true) {
      toolAngle = clamp(Math.round(Number(value) || 0), 0, 180);
      angleInput.value = String(toolAngle);
      paintRange(angleInput);
      angleValue.value = `${toolAngle}°`;
      angleValue.textContent = `${toolAngle}°`;
      placeCard(toolPose.x, toolPose.y, toolAngle);
      if (persist) {
        try { localStorage.setItem(ANGLE_KEY, String(toolAngle)); } catch (_) {}
      }
    }

    function setToolLength(value, persist = true) {
      toolLength = clamp(Math.round(Number(value) || 20), 20, 240);
      lengthInput.value = String(toolLength);
      paintRange(lengthInput);
      lengthValue.value = String(toolLength);
      lengthValue.textContent = String(toolLength);
      placeCard(toolPose.x, toolPose.y, toolAngle);
      if (persist) {
        try { localStorage.setItem(LENGTH_KEY, String(toolLength)); } catch (_) {}
      }
    }

    function beginHistory() {
      // начался новый жест — предыдущий записываем немедленно
      if (commitTimer) { clearTimeout(commitTimer); commitTimer = 0; commitHistory(); }
      strokeStart = engine.field.slice();
    }

    // Шаг записывается не в момент отпускания, а когда песок уляжется: жест —
    // это действие вместе с его последствиями, иначе откат вернёт середину
    // осыпания и оставит поле не тем, что было.
    function scheduleCommit() {
      clearTimeout(commitTimer);
      commitTimer = setTimeout(() => { commitTimer = 0; commitHistory(); }, 700);
    }

    function commitHistory() {
      if (!strokeStart) return;
      const before = strokeStart;
      strokeStart = null;
      const field = engine.field;
      if (before.length !== field.length) return;   // размер сменился, откат не свяжется
      const index = [], value = [];
      for (let i = 0; i < field.length; i++) {
        if (before[i] === field[i]) continue;
        index.push(i); value.push(before[i]);
      }
      if (!index.length) return;
      history.push({ index: Int32Array.from(index), value: Float32Array.from(value) });
      if (history.length > UNDO_DEPTH) history.shift();
    }

    function undo() {
      if (commitTimer) { clearTimeout(commitTimer); commitTimer = 0; commitHistory(); }
      const step = history.pop();
      if (!step) return;
      engine.free.count = 0;      // зёрна в полёте досыпали бы массу поверх отката
      const field = engine.field;
      if (step.index.length && step.index[step.index.length - 1] >= field.length) return;
      for (let i = 0; i < step.index.length; i++) field[step.index[i]] = step.value[i];
      dirty = true;
      updateInvite();
      scheduleSave(600);
    }

    let panFrom = null;

    function onPointerDown(event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      if (panning) {
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
        activePointer = event.pointerId;
        panFrom = { x: event.clientX, y: event.clientY, viewX: view.x, viewY: view.y };
        return;
      }
      beginHistory();
      try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      activePointer = event.pointerId;
      const start = clampToolScreen(event.clientX, event.clientY, toolAngle);
      const stage = toStage(start.x, start.y);
      tool.x = tool.px = stage.x;
      tool.y = tool.py = stage.y;
      tool.down = true;
      placeCard(start.x, start.y, toolAngle);
    }

    function onPointerMove(event) {
      const dragging = activePointer === event.pointerId;
      if (dragging) event.preventDefault();
      if (panFrom && dragging) {
        view.x = panFrom.viewX - (event.clientX - panFrom.x);
        view.y = panFrom.viewY - (event.clientY - panFrom.y);
        clampView();
        return;
      }
      // coalesced-события несут все промежуточные точки быстрого движения,
      // иначе на резком жесте скребок телепортируется
      const samples = dragging && typeof event.getCoalescedEvents === 'function'
        ? event.getCoalescedEvents() : [event];
      let screen = null;
      for (const sample of samples) {
        screen = clampToolScreen(sample.clientX, sample.clientY, toolAngle);
        if (dragging) {
          const stage = toStage(screen.x, screen.y);
          pending.push({ x: stage.x, y: stage.y });
        }
      }
      if (screen) placeCard(screen.x, screen.y, toolAngle);
    }

    function finishPointer(event, cancelled) {
      if (activePointer !== event.pointerId) return;
      activePointer = null;
      if (panFrom) { panFrom = null; return; }
      tool.down = false;
      scheduleCommit();
      scheduleSave(1000);
    }

    function saveState() {
      if (!dirty) return;
      try {
        const field = engine.field;
        const packed = new Uint16Array(field.length);
        for (let i = 0; i < field.length; i++)
          packed[i] = Math.round(clamp(field[i] / MAX_HEIGHT, 0, 1) * 65535);
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          version: SAVE_VERSION,
          cols: engine.cols,
          rows: engine.rows,
          data: bytesToBase64(new Uint8Array(packed.buffer))
        }));
        dirty = false;
      } catch (error) {
        console.warn('Не удалось сохранить песок:', error);
      }
    }

    // Формат сменился вместе с моделью: поле старой версии описывает другую
    // физику и в новую не переводится, поэтому просто отбрасывается.
    function loadState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (saved.version !== SAVE_VERSION) return null;
        const packed = new Uint16Array(base64ToBytes(saved.data).buffer);
        if (packed.length !== saved.cols * saved.rows) return null;
        const field = new Float32Array(packed.length);
        for (let i = 0; i < packed.length; i++) field[i] = packed[i] / 65535 * MAX_HEIGHT;
        // размеры могли быть другими: окно меняли, экран сменился
        return { field, cols: saved.cols, rows: saved.rows };
      } catch (error) {
        return null;
      }
    }

    function bytesToBase64(bytes) {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function clamp(value, min, max) {
      return value < min ? min : value > max ? max : value;
    }

    addEventListener('beforeunload', saveState);
    window.sandDebug = { getStats, engine: () => engine, tool, view };
  })();
  </script>
</body>
</html>
