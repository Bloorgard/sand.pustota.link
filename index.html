<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4f4f1">
  <link rel="icon" href="data:,">
  <title>sand.pustota.link</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #111111;
      --table: #f4f4f1;
      --glass: rgba(244, 244, 241, .84);
      --line: rgba(17, 17, 17, .34);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--table);
      color: var(--ink);
    }

    button { font: inherit; }

    #sand {
      cursor: none;
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: none;
      touch-action: none;
    }

    .topbar {
      position: fixed;
      z-index: 3;
      top: max(18px, env(safe-area-inset-top));
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      pointer-events: none;
    }

    .brand {
      display: grid;
      gap: 5px;
      user-select: none;
    }

    .brand strong {
      font-size: 12px;
      line-height: 1;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 720;
    }

    .brand span {
      font-size: 11px;
      line-height: 1.35;
      opacity: .54;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .actions {
      display: flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(9px);
      pointer-events: auto;
    }

    .actions button {
      min-height: 38px;
      padding: 0 13px;
      border: 0;
      border-right: 1px solid var(--line);
      color: inherit;
      background: transparent;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .actions button:last-child { border-right: 0; }
    .actions button:hover, .actions button:focus-visible { background: rgba(255,255,255,.14); }
    .actions button:focus-visible { outline: 2px solid var(--ink); outline-offset: -3px; }

    .parameter-control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 12px;
      border-right: 1px solid var(--line);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .parameter-control input {
      width: 82px;
      margin: 0;
      accent-color: var(--ink);
      cursor: ew-resize;
    }

    .angle-value {
      width: 30px;
      font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
    }

    .physics {
      position: fixed;
      z-index: 4;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(58px, env(safe-area-inset-bottom));
      width: 232px;
      max-height: 64vh;
      overflow-y: auto;
      display: grid;
      gap: 2px;
      padding: 12px 14px;
      border: 1px solid rgba(26, 28, 30, .15);
      border-radius: 12px;
      background: rgba(244, 244, 241, .86);
      backdrop-filter: blur(10px);
    }

    /* display: grid перебивает браузерное правило для [hidden] */
    .physics[hidden] { display: none; }

    .physics b {
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      opacity: .5;
      margin-bottom: 6px;
    }

    .physics label {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 2px 8px;
      margin-bottom: 7px;
      font-size: 11px;
      opacity: .75;
    }

    .physics input {
      grid-column: 1 / -1;
      width: 100%;
      margin-top: 1px;
      accent-color: #1a1c1e;
    }

    .physics output {
      font-variant-numeric: tabular-nums;
      opacity: .8;
    }

    .legend {
      position: fixed;
      z-index: 3;
      right: max(20px, env(safe-area-inset-right));
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + 26px);
      display: grid;
      gap: 5px;
      opacity: .4;
      user-select: none;
      pointer-events: none;
    }

    .legend div {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .legend kbd {
      display: inline-grid;
      place-items: center;
      min-width: 19px;
      height: 19px;
      padding: 0 4px;
      border: 1px solid rgba(26, 28, 30, .22);
      border-radius: 4px;
      font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .legend i {
      font-style: normal;
      font-size: 10.5px;
      margin-left: 4px;
      min-width: 54px;
    }

    /* на узком экране клавиатуры нет, а легенда налезает на подсказку */
    @media (max-width: 720px) {
      .legend { display: none; }
    }

    .hint {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: max(25px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      padding: 9px 13px;
      border: 1px solid rgba(26, 28, 30, .15);
      border-radius: 999px;
      background: rgba(244, 244, 241, .72);
      backdrop-filter: blur(8px);
      font-size: 11px;
      letter-spacing: .04em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 450ms ease;
    }

    .hint.hidden { opacity: 0; }

    .status {
      position: fixed;
      z-index: 3;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      opacity: .46;
      pointer-events: none;
    }

    @media (max-width: 620px) {
      .topbar { flex-direction: column; align-items: stretch; gap: 12px; }
      .brand span { display: none; }
      .actions { align-self: stretch; display: grid; grid-template-columns: 1fr 1fr; border-radius: 22px; }
      .parameter-control { grid-column: 1 / -1; min-height: 36px; padding: 0 12px; border-right: 0; border-bottom: 1px solid var(--line); }
      .parameter-control input { flex: 1; width: auto; }
      .actions button { min-height: 36px; padding: 0 12px; font-size: 10px; }

      .status { left: max(18px, env(safe-area-inset-left)); right: auto; bottom: max(14px, env(safe-area-inset-bottom)); }
      .physics {
      position: fixed;
      z-index: 4;
      left: max(18px, env(safe-area-inset-left));

      width: 232px;

    }

    .physics[hidden] { display: none; }

    }

    /* на узком экране клавиатуры нет, а легенда налезает на подсказку */
    @media (max-width: 720px) {
      .legend { display: none; }
    }

    .hint { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 23px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .physics {
      position: fixed;
      z-index: 4;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(58px, env(safe-area-inset-bottom));

    }

    @media (max-width: 720px) {
      .legend { display: none; }
    }

    .hint { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="sand" aria-label="Пустой стол с конечной горстью песка. Зажмите и ведите скребок, чтобы придавать кучке форму."></canvas>

  <header class="topbar">
    <div class="brand">
      <strong>sand.pustota.link</strong>
    </div>
    <div class="controls">
      <div class="actions tool-group" role="group" aria-label="Скребок">
        <label class="parameter-control angle-control" for="angle">
          <span>угол</span>
          <input id="angle" type="range" min="0" max="180" step="1" value="45">
          <output id="angle-value" class="angle-value" for="angle">45°</output>
        </label>
        <label class="parameter-control length-control" for="length">
          <span>длина</span>
          <input id="length" type="range" min="70" max="240" step="5" value="150">
          <output id="length-value" class="angle-value" for="length">150</output>
        </label>
      </div>
      <nav class="actions" aria-label="Действия">
        <button id="style" type="button" aria-pressed="false" title="Чёрно-белая графика или боковой свет">свет</button>
        <button id="add-sand" type="button">досыпать</button>
        <button id="reset" type="button">сбросить</button>
        <button id="export" type="button">экспорт</button>
      </nav>
    </div>
  </header>

  <div id="hint" class="hint">проведи скребком через кучку</div>
  <div id="status" class="status" aria-live="polite"></div>

  <aside id="physics" class="physics" hidden aria-label="Настройки материала">
    <b>материал</b>
    <label><span>откос</span><output>2.05</output><input type="range" id="p-talus" min="0" max="3" step="0.05" value="2.05"></label>
    <label><span>осыпание</span><output>0.24</output><input type="range" id="p-relax" min="0" max="0.25" step="0.01" value="0.24"></label>
    <label><span>слёживание</span><output>0.17</output><input type="range" id="p-settle" min="0" max="0.3" step="0.01" value="0.17"></label>
    <label><span>сцепление</span><output>3.5</output><input type="range" id="p-cohesion" min="0" max="8" step="0.1" value="3.5"></label>
    <label><span>высота лезвия</span><output>26</output><input type="range" id="p-blade" min="4" max="200" step="2" value="26"></label>
    <label><span>россыпь</span><output>0.3</output><input type="range" id="p-spray" min="0" max="3" step="0.1" value="0.3"></label>
  </aside>

  <div id="legend" class="legend" aria-hidden="true">
    <div><kbd>Q</kbd><kbd>W</kbd><i>поворот</i></div>
    <div><kbd>E</kbd><kbd>R</kbd><i>шаг 45°</i></div>
    <div><kbd>S</kbd><kbd>D</kbd><i>длина</i></div>
    <div><kbd>A</kbd><i>сыпать</i></div>
    <div><kbd>`</kbd><i>материал</i></div>
  </div>

  <script src="engine/sand.js"></script>
  <script src="engine/render.js"></script>

  <script>
  (() => {
    'use strict';

    const canvas = document.querySelector('#sand');
    const context = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const hint = document.querySelector('#hint');
    const status = document.querySelector('#status');
    const resetButton = document.querySelector('#reset');
    const exportButton = document.querySelector('#export');
    const addSandButton = document.querySelector('#add-sand');
    const angleInput = document.querySelector('#angle');
    const angleValue = document.querySelector('#angle-value');
    const lengthInput = document.querySelector('#length');
    const lengthValue = document.querySelector('#length-value');
    const styleButton = document.querySelector('#style');
    const physics = document.querySelector('#physics');

    const SAVE_KEY = 'sand.pustota.sculpt06';
    const ANGLE_KEY = 'sand.pustota.scraper-angle';
    const LENGTH_KEY = 'sand.pustota.scraper-length';
    const STYLE_KEY = 'sand.pustota.style';
    const MAX_HEIGHT = 64.0;        // потолок упаковки: вал доходит до сорока
    const SAVE_VERSION = 3;

    let engine = null;
    let target = null;
    let initialMass = 0;
    let style = 'plain';   // по умолчанию плоская графика, свет включается кнопкой

    let activePointer = null;
    let dirty = false;
    let saveTimer = 0;
    let frameTimes = [];
    let lastFrameTime = performance.now();
    const HINT_KEY = 'sand.pustota.hint-seen';
    let hiddenHint = false;
    try { hiddenHint = localStorage.getItem(HINT_KEY) === '1'; } catch (_) {}
    if (hiddenHint) hint.classList.add('hidden');
    let toolAngle = 45;
    let toolLength = 150;

    // скребок: где он и ведут ли его прямо сейчас
    const tool = { x: 0, y: 0, px: 0, py: 0, down: false };
    // Отрезки жеста, накопленные между кадрами. Без очереди быстрый штрих
    // пропадает целиком: down, move и up успевают пройти до ближайшего кадра,
    // и к моменту отрисовки вести уже нечего.
    const pending = [];
    const toolPose = { x: innerWidth * 0.72, y: innerHeight * 0.72 };

    try {
      if (localStorage.getItem(STYLE_KEY) === 'light') style = 'light';
    } catch (_) {}

    try {
      const rawAngle = localStorage.getItem(ANGLE_KEY);
      if (rawAngle !== null) {
        const storedAngle = Number(rawAngle);
        if (Number.isFinite(storedAngle)) toolAngle = clamp(storedAngle, 0, 180);
      }
    } catch (_) {}

    try {
      const rawLength = localStorage.getItem(LENGTH_KEY);
      if (rawLength !== null) {
        const storedLength = Number(rawLength);
        if (Number.isFinite(storedLength)) toolLength = clamp(storedLength, 70, 240);
      }
    } catch (_) {}

    resizeCanvas();
    initialize();
    addEventListener('resize', onResize, { passive: true });
    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', event => finishPointer(event, false));
    canvas.addEventListener('pointercancel', event => finishPointer(event, true));
    resetButton.addEventListener('click', resetSand);
    addSandButton.addEventListener('click', addSandAtTool);
    exportButton.addEventListener('click', exportImage);
    angleInput.addEventListener('input', () => setToolAngle(Number(angleInput.value)));
    lengthInput.addEventListener('input', () => setToolLength(Number(lengthInput.value)));
    styleButton.addEventListener('click', () => {
      style = style === 'light' ? 'plain' : 'light';
      applyStyle();
    });
    setToolAngle(toolAngle, false);
    setToolLength(toolLength, false);
    applyStyle();
    bindPhysicsPanel();
    requestAnimationFrame(tick);

    function applyStyle() {
      styleButton.setAttribute('aria-pressed', style === 'light' ? 'true' : 'false');
      try { localStorage.setItem(STYLE_KEY, style); } catch (_) {}
    }

    // Панель материала — инструмент отладки: значения не сохраняются между
    // сессиями, рабочая калибровка живёт в значениях по умолчанию движка.
    function bindPhysicsPanel() {
      for (const input of physics.querySelectorAll('input')) {
        const key = input.id.slice(2);          // p-talus → talus
        const out = input.parentElement.querySelector('output');
        const sync = () => {
          engine.params[key] = Number(input.value);
          out.textContent = input.value;
        };
        input.addEventListener('input', sync);
        sync();
      }
    }

    // ── клавиши под левой рукой, по event.code — работают в любой раскладке ──
    const keys = new Set();
    const HOTKEYS = ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyA', 'KeyS', 'KeyD'];

    addEventListener('keydown', event => {
      if (event.code === 'Backquote') {
        event.preventDefault();
        physics.hidden = !physics.hidden;
        return;
      }
      if (!HOTKEYS.includes(event.code)) return;
      event.preventDefault();
      if (event.repeat) return;
      keys.add(event.code);
      if (event.code === 'KeyE') snapAngle(-45);
      else if (event.code === 'KeyR') snapAngle(45);
    });
    addEventListener('keyup', event => {
      if (!keys.delete(event.code)) return;
      // при удержании параметры не пишутся в хранилище каждый кадр —
      // сохраняем один раз, когда клавишу отпустили
      if (event.code === 'KeyQ' || event.code === 'KeyW') setToolAngle(toolAngle);
      if (event.code === 'KeyS' || event.code === 'KeyD') setToolLength(toolLength);
    });
    addEventListener('blur', () => keys.clear());

    function snapAngle(delta) {
      const snapped = Math.round(toolAngle / 45) * 45 + delta;
      setToolAngle((snapped % 180 + 180) % 180);
    }

    function applyKeys(dt) {
      if (!keys.size) return;
      const rot = 75 * dt, grow = 260 * dt;
      if (keys.has('KeyA')) { engine.pour(toolPose.x, toolPose.y, dt); scheduleSave(900); }
      if (keys.has('KeyQ')) setToolAngle(((toolAngle - rot) % 180 + 180) % 180, false);
      if (keys.has('KeyW')) setToolAngle((toolAngle + rot) % 180, false);
      if (keys.has('KeyS')) setToolLength(toolLength - grow, false);
      if (keys.has('KeyD')) setToolLength(toolLength + grow, false);
    }

    function resizeCanvas() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(innerWidth * dpr));
      canvas.height = Math.max(1, Math.round(innerHeight * dpr));
      toolPose.x = clamp(toolPose.x, 0, innerWidth);
      toolPose.y = clamp(toolPose.y, 0, innerHeight);
      target = SandRender.createTarget(context, canvas.width, canvas.height, dpr);
    }

    function onResize() {
      resizeCanvas();
      // поле привязано к размеру стола, поэтому пересоздаём и насыпаем заново
      initialize(true);
      placeCard(toolPose.x, toolPose.y, toolAngle);
    }

    function initialize(forceFresh = false) {
      engine = SandEngine.create(innerWidth, innerHeight);
      const saved = forceFresh ? null : loadState();
      if (saved) engine.field.set(saved);
      else engine.pile(innerWidth * 0.5, innerHeight * 0.5,
                       Math.min(innerWidth, innerHeight) * 0.12, 7);
      initialMass = engine.mass();
      dirty = false;
    }

    function tick(now) {
      const elapsed = now - lastFrameTime;
      lastFrameTime = now;
      frameTimes.push(elapsed);
      if (frameTimes.length > 36) frameTimes.shift();

      applyKeys(Math.min(elapsed, 50) / 1000);

      if (pending.length) {
        for (const point of pending) {
          engine.blade(tool.px, tool.py, point.x, point.y, toolAngle, toolLength);
          tool.px = point.x; tool.py = point.y;
        }
        tool.x = tool.px; tool.y = tool.py;
        pending.length = 0;
        dirty = true;
      }
      engine.stampWall(tool.x, tool.y, tool.px, tool.py, toolAngle, toolLength, tool.down);
      engine.tick();

      SandRender.draw(target, engine, style);
      drawTool();

      if (Math.floor(now / 800) !== Math.floor((now - elapsed) / 800)) updateStatus();
      requestAnimationFrame(tick);
    }

    function exportImage() {
      SandRender.draw(target, engine, style);   // без скребка: он не часть работы
      canvas.toBlob(blob => {
        if (!blob) return;
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `sand-sculpture-${new Date().toISOString().slice(0, 10)}.png`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, 'image/png');
    }

    // Цифры не должны дёргаться на пустом месте: процент показывается с одним
    // знаком, а кадры — только когда их мало и это стоит знать.
    let lastStatus = '';

    function updateStatus() {
      const average = frameTimes.length ? frameTimes.reduce((a, b) => a + b, 0) / frameTimes.length : 16.7;
      const fps = Math.round(1000 / Math.max(average, 1));
      const mass = engine.mass();
      const massPercent = initialMass ? Math.round(mass / initialMass * 1000) / 10 : 100;
      const text = fps < 45 ? `${massPercent}% песка · ${fps} fps` : `${massPercent}% песка`;
      if (text === lastStatus) return;
      lastStatus = text;
      status.textContent = text;
    }

    function getStats() {
      const mass = engine.mass();
      return {
        cols: engine.cols,
        rows: engine.rows,
        cell: engine.cell,
        mass,
        initialMass,
        massError: initialMass ? (mass - initialMass) / initialMass : 0,
        airborne: engine.free.count,
        active: activePointer !== null,
        toolAngle,
        toolLength,
        style,
        renderer: 'grain2d'
      };
    }

    function resetSand() {
      try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
      initialize(true);
      flash('горсть возвращена');
    }

    function addSandAtTool() {
      engine.pile(toolPose.x, toolPose.y, Math.min(innerWidth, innerHeight) * 0.07, 5);
      initialMass = engine.mass();
      scheduleSave(700);
      flash('песок досыпан у скребка');
      return initialMass;
    }

    function flash(text) {
      hint.textContent = text;
      hint.classList.remove('hidden');
      setTimeout(() => hint.classList.add('hidden'), 1150);
    }

    function scheduleSave(delay) {
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveState, delay);
    }

    function clampToolScreen(x, y, angle) {
      const width = toolLength;
      const height = 6;
      const radians = angle * Math.PI / 180;
      const halfX = Math.abs(Math.cos(radians)) * width * 0.5 + Math.abs(Math.sin(radians)) * height * 0.5;
      const halfY = Math.abs(Math.sin(radians)) * width * 0.5 + Math.abs(Math.cos(radians)) * height * 0.5;
      return {
        x: clamp(x, halfX + 2, innerWidth - halfX - 2),
        y: clamp(y, halfY + 2, innerHeight - halfY - 2)
      };
    }

    function placeCard(x, y, angle) {
      const screen = clampToolScreen(x, y, angle);
      toolPose.x = screen.x;
      toolPose.y = screen.y;
    }

    // Скребок — линия на холсте, а не элемент страницы: карточка с градиентом
    // и тенью спорила с зерном, линия честнее показывает, где кромка.
    function drawTool() {
      const scale = target.scale;
      const radians = toolAngle * Math.PI / 180;
      const hx = Math.cos(radians) * toolLength * 0.5 * scale;
      const hy = Math.sin(radians) * toolLength * 0.5 * scale;
      const x = toolPose.x * scale, y = toolPose.y * scale;
      context.save();
      context.lineCap = 'round';
      context.strokeStyle = tool.down ? 'rgba(26, 28, 30, .85)' : 'rgba(26, 28, 30, .3)';
      context.lineWidth = (tool.down ? 3 : 2) * scale;
      context.beginPath();
      context.moveTo(x - hx, y - hy);
      context.lineTo(x + hx, y + hy);
      context.stroke();
      context.restore();
    }

    function setToolAngle(value, persist = true) {
      toolAngle = clamp(Math.round(Number(value) || 0), 0, 180);
      angleInput.value = String(toolAngle);
      angleValue.value = `${toolAngle}°`;
      angleValue.textContent = `${toolAngle}°`;
      placeCard(toolPose.x, toolPose.y, toolAngle);
      if (persist) {
        try { localStorage.setItem(ANGLE_KEY, String(toolAngle)); } catch (_) {}
      }
    }

    function setToolLength(value, persist = true) {
      toolLength = clamp(Math.round((Number(value) || 70) / 5) * 5, 70, 240);
      lengthInput.value = String(toolLength);
      lengthValue.value = String(toolLength);
      lengthValue.textContent = String(toolLength);
      placeCard(toolPose.x, toolPose.y, toolAngle);
      if (persist) {
        try { localStorage.setItem(LENGTH_KEY, String(toolLength)); } catch (_) {}
      }
    }

    function onPointerDown(event) {
      if (event.pointerType === 'mouse' && event.button !== 0) return;
      event.preventDefault();
      try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      activePointer = event.pointerId;
      const start = clampToolScreen(event.clientX, event.clientY, toolAngle);
      tool.x = tool.px = start.x;
      tool.y = tool.py = start.y;
      tool.down = true;
      placeCard(start.x, start.y, toolAngle);
      if (!hiddenHint) {
        hint.classList.add('hidden');
        hiddenHint = true;
        try { localStorage.setItem(HINT_KEY, '1'); } catch (_) {}
      }
    }

    function onPointerMove(event) {
      const dragging = activePointer === event.pointerId;
      if (dragging) event.preventDefault();
      // coalesced-события несут все промежуточные точки быстрого движения,
      // иначе на резком жесте скребок телепортируется
      const samples = dragging && typeof event.getCoalescedEvents === 'function'
        ? event.getCoalescedEvents() : [event];
      let screen = null;
      for (const sample of samples) {
        screen = clampToolScreen(sample.clientX, sample.clientY, toolAngle);
        if (dragging) pending.push({ x: screen.x, y: screen.y });
      }
      if (screen) placeCard(screen.x, screen.y, toolAngle);
    }

    function finishPointer(event, cancelled) {
      if (activePointer !== event.pointerId) return;
      activePointer = null;
      tool.down = false;
      scheduleSave(1000);
    }

    function saveState() {
      if (!dirty) return;
      try {
        const field = engine.field;
        const packed = new Uint16Array(field.length);
        for (let i = 0; i < field.length; i++)
          packed[i] = Math.round(clamp(field[i] / MAX_HEIGHT, 0, 1) * 65535);
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          version: SAVE_VERSION,
          cols: engine.cols,
          rows: engine.rows,
          data: bytesToBase64(new Uint8Array(packed.buffer))
        }));
        dirty = false;
      } catch (error) {
        console.warn('Не удалось сохранить песок:', error);
      }
    }

    // Формат сменился вместе с моделью: поле старой версии описывает другую
    // физику и в новую не переводится, поэтому просто отбрасывается.
    function loadState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (saved.version !== SAVE_VERSION) return null;
        if (saved.cols !== engine.cols || saved.rows !== engine.rows) return null;
        const packed = new Uint16Array(base64ToBytes(saved.data).buffer);
        const out = new Float32Array(packed.length);
        for (let i = 0; i < packed.length; i++) out[i] = packed[i] / 65535 * MAX_HEIGHT;
        return out;
      } catch (error) {
        return null;
      }
    }

    function bytesToBase64(bytes) {
      let binary = '';
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      return btoa(binary);
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function clamp(value, min, max) {
      return value < min ? min : value > max ? max : value;
    }

    addEventListener('beforeunload', saveState);
    window.sandDebug = { getStats, engine: () => engine, tool };
  })();
  </script>
</body>
</html>
